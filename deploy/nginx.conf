server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # O TLS é terminado pelo Traefik do Dokploy — aqui só HTTP interno.

    # ---------------------------------------------------------------------
    # Cabeçalhos de segurança
    # ---------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # O painel tem dado de crédito e acesso externo: não deve ser indexado.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # HSTS por um ano. Só faz efeito sobre HTTPS, então é inofensivo enquanto
    # o domínio definitivo não sai.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CSP: 'unsafe-inline' em style-src é exigido pelo Tailwind/Radix, que
    # injetam estilos em runtime. script-src fica sem 'unsafe-inline' — o bundle
    # do Vite não precisa. connect-src precisa alcançar o Supabase; ajuste
    # SUPABASE_HOST para o domínio real na primeira publicação.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co https://*.maistodos.com.br; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---------------------------------------------------------------------
    # Cache
    # ---------------------------------------------------------------------

    # Assets do Vite têm hash no nome — podem ser cacheados indefinidamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # O index.html nunca é cacheado: é ele que aponta para o bundle novo depois
    # de cada deploy. Sem isso, o usuário fica preso na versão antiga.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # SPA: qualquer rota desconhecida devolve o index e o React Router resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
